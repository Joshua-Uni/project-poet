[tool.pytest.ini_options]
pythonpath = ["training/src", "hosting/api/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["training/src", "hosting/api/src"]
explicit_package_bases = true
files = ["training/src", "hosting/api/src"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["tokenizers.*", "yaml.*", "pandas.*"]
ignore_missing_imports = true
