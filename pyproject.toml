[project]
name = "project_poet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "matplotlib==3.10.8",
    "torch==2.13.0",
    "PyYAML==6.0.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["training/src"]