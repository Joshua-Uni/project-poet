#If resume = True then we load old cfg artifacts/ckpt.pt
#BUT we still use this cfg's train and data!

train: #resume=true --> still used
  resume: False
  model_path: "artifacts/ckpt.pt" # last epoch, used to resume
  best_path: "artifacts/best.pt" # lowest val loss, used by eval and the API
  log_lvl: INFO
  learning_rate: 0.001
  weight_decay: 0.01 #adamW
  max_norm: 1.8 #Grad Clipping
  epochs: 100
  batch_size: 20

model: #resume=true --> replaced with saved ckpt
  embedding_dim: 64
  max_block_size: 768
  n_layers: 3
  n_head: 2
  head_size: 32
  dropout: 0.2

tokenizer: #resume=true --> replaced with saved ckpt
  vocab_size: 4000
  save_path: "artifacts/tokenizer.json"
  title_start: "<title>"
  title_end: "</title>"
  poem_start: "<poem>"
  poem_end: "</poem>"

data: #resume=true --> still used
  data_path: "data/processed/poems.csv"
  seed: 7899
  val_ratio: 0.1
