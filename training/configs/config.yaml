#If resume = True then we load old cfg artifacts/ckpt.pt
#BUT we still use this cfg's train and data!

train: #resume=true --> still used
  resume: False
  model_path: "artifacts/ckpt.pt"
  log_lvl: INFO
  learning_rate: 0.01
  epochs: 5
  batch_size: 10

model: #resume=true --> replaced with ckpt
  embedding_dim: 64
  max_block_size: 768
  n_layers: 3
  n_head: 2
  head_size: 32
  dropout: 0.2

tokenizer: #resume=true --> replaced with ckpt
  vocab_size: 3500
  save_path: "artifacts/tokenizer.json"
  title_start: "<title>"
  title_end: "</title>"
  poem_start: "<poem>"
  poem_end: "</poem>"

data: #resume=true --> still used
  data_path: "data/processed/trial_processed.csv"
  seed: 7899
  val_ratio: 0.5
