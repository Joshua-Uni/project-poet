
#model
model:
  learning_rate: 0.005
  batch_size: 10
  embedding_dim: 64
  max_block_size: 768
  n_layers: 3
  n_head: 4
  head_size: 16
  dropout: 0.2


#tokenizer
tokenizer:
  vocab_size: 4000
  save_path: "artifacts/tokenizer.json"
  title_start: "<title>"
  title_end: "</title>"
  poem_start: "<poem>"
  poem_end: "</poem>"

#input
data:
  data_path: "data/processed/trial_processed.csv"
  seed: 7899
  val_ratio: 0.2
